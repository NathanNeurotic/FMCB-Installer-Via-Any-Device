name: Apply FHDB source fix

on:
  push:
    branches:
      - agent/fix-fhdb-install

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: apk add --no-cache build-base git python3

      - name: Patch FHDB MBR handling
        shell: sh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("installer/system.c")
          text = path.read_text()

          double_close = '''                    fclose(file);
                } else {
'''
          single_close = '''                    /*
                     * Do not close here. The common cleanup below closes the
                     * source once for every target. Closing twice was tolerated
                     * by the old libc but is undefined and can corrupt modern
                     * newlib state immediately after the FHDB MBR write.
                     */
                } else {
'''
          if text.count(double_close) != 1:
              raise SystemExit("Expected exactly one FHDB double-close site")
          text = text.replace(double_close, single_close, 1)

          unchecked_osdmbr = '''            fileXioDevctl("hdd0:", APA_DEVCTL_SET_OSDMBR, &OSDData, sizeof(OSDData), NULL, 0);
'''
          checked_osdmbr = '''            result = fileXioDevctl("hdd0:", APA_DEVCTL_SET_OSDMBR, &OSDData, sizeof(OSDData), NULL, 0);
            if (result >= 0)
                result = fileXioDevctl("hdd0:", APA_DEVCTL_FLUSH_CACHE, NULL, 0, NULL, 0);
'''
          if text.count(unchecked_osdmbr) != 1:
              raise SystemExit("Expected exactly one unchecked SET_OSDMBR call")
          text = text.replace(unchecked_osdmbr, checked_osdmbr, 1)

          path.write_text(text)
          PY

      - name: Build installer
        run: make -C installer clean all

      - name: Commit source fix and remove one-shot workflow
        shell: sh
        run: |
          rm .github/workflows/agent-fix-fhdb.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/system.c
          git add -u .github/workflows/agent-fix-fhdb.yml
          git commit -m "Fix FHDB MBR install under modern newlib"
          git push origin HEAD:agent/fix-fhdb-install
