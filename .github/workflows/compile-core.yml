name: Build [All]

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - 'installer_res/**'
      - '.github/workflows/compile-core.yml'
  schedule:
    - cron: "0 15 1 * *"

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          apk add build-base git python3 zip p7zip

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch

      - name: Get short SHA
        run: echo "SHA8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_ENV"

      - name: Compile current-stack FHDB fix
        run: |
          cd installer
          make rebuild \
            FMCB_INSTALLER_VERSION="${{ env.SHA8 }}-fhdb-verified" \
            EE_BIN_DIR=../installer_res/

      - name: Prepare package
        run: |
          cd installer_res
          printf '%s\n' 'Modern SDK/IOP stack; direct PFS writes; MBR and PFS read-back verification.' > FHDB_TEST_VARIANT.txt
          chmod +x ./pack.sh
          ./pack.sh

      - name: Upload artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: FMCB-${{ env.SHA8 }}-fhdb-verified
          path: |
            FMCB*.7z
          retention-days: 14

      - name: Create release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeMcBoot
          files: FMCB*.7z
